  <g id="text_18">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(51.84 497.802529)">372 positive pairs • all five outer folds • seed 20260921 • paired table bootstrap, 2,000 resamples. S16.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(51.84 508.004854)">ABS vs A also changes tree count, L1 and weighting; not a pure ranking-objective ablation.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(51.84 518.207178)">Already studied Development • researcher-selection bias • not independent Evaluation performance</text>
