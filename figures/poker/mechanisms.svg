   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137c83" x="133.4448" y="109.091565" transform="rotate(-0 133.4448 109.091565)">Soft Play</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(133.4448 126.932335)">Legal raise opportunity</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(133.4448 141.432335)">A faces B’s price</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(133.4448 156.901085)">A does not raise</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(133.4448 167.67296)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(133.4448 184.793273)">Signal: −log(1−p_raise)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(133.4448 200.401085)">when nonraise occurs</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(133.4448 211.17296)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(133.4448 228.432335)">Could also be a valid slow-play.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137c83" x="357.7608" y="109.091565" transform="rotate(-0 357.7608 109.091565)">Directed Transfer</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(357.7608 126.932335)">A faces B’s price</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(357.7608 141.293273)">A calls despite low p_call</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(357.7608 155.932335)">Price and equity condition p</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(357.7608 167.67296)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(357.7608 184.793273)">Signal: −log(p_call)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(357.7608 200.401085)">when call occurs</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(357.7608 211.17296)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(357.7608 228.432335)">Call is not realized A→B profit.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137c83" x="582.0768" y="109.091565" transform="rotate(-0 582.0768 109.091565)">Coordinated Isolation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 126.932335)">A applies pressure</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 141.432335)">B has a legal relay opportunity</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 155.932335)">Pair re-aggresses; others exit</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 167.67296)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 184.793273)">Signal: −log(p_relay)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 199.432335)">when relay occurs</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 211.17296)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 228.432335)">Co-occurrence is not causality.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="51.84" y="21.125344" transform="rotate(-0 51.84 21.125344)">Three observable mechanisms, three limits to interpretation</text>
  </g>
  <g id="text_8">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(51.84 382.940854)">S01–S05. Schematic examples; no empirical population or performance metric.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(51.84 393.143178)">Methods developed on studied Development labels: researcher-selection bias; no measured real-world cheating accuracy.</text>
  </g>
 </g>
