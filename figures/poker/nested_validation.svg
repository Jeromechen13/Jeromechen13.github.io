   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137c83" x="140.1408" y="108.560061" transform="rotate(-0 140.1408 108.560061)">Outer training universe T = all tables except V</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(140.1408 130.228279)">320 training tables → inner held-out block J</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(140.1408 144.728279)">Fit policy / reference / stage1 only inside T \ J</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(140.1408 159.228279)">Training stage2 inputs: row-block-excluded stage1</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(140.1408 173.728279)">Early stopping and method choice stay inside T</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b6642c" x="582.0768" y="108.560061" transform="rotate(-0 582.0768 108.560061)">Outer held-out V</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 130.228279)">80 tables per fold</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 144.728279)">No fitting / tuning / prior update</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 160.197029)">Local unlabeled window allowed</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 173.728279)">Labels used only for scoring</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #137c83" x="140.1408" y="316.329741" transform="rotate(-0 140.1408 316.329741)">Why ordinary global OOF is insufficient</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(140.1408 338.966709)">A row can be OOF while its fitted ancestors include V.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(140.1408 352.497959)">Cache key includes training-table hash and all ancestors.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b6642c" x="582.0768" y="316.329741" transform="rotate(-0 582.0768 316.329741)">Uncertainty</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 337.997959)">2,000 paired table resamples</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 352.497959)">Keep zero-label tables</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(582.0768 366.997959)">No model refit in bootstrap</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="543.24" y="149.44752" transform="rotate(-0 543.24 149.44752)">predict</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="51.84" y="21.8055" transform="rotate(-0 51.84 21.8055)">Nested validation: every fitted ancestor respects the held-out tables</text>
  </g>
  <g id="text_11">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(51.84 452.420854)">S09, S14. Table isolation also isolated players/hands in this dataset; assert again on new data.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(51.84 462.623178)">Already studied Development • researcher-selection bias • not independent Evaluation performance</text>
  </g>
 </g>
