  <g id="text_18">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(47.52 411.172205)">372 positive pairs • 1,817 disclosed truths • five table folds • seed 20260921</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(47.52 421.374529)">Bars: pooled OOF; whiskers: conditional 95% table bootstrap (2,000). S07, S15, S34.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(47.52 431.576854)">Already studied Development • researcher-selection bias • not independent Evaluation performance</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627384" transform="translate(47.52 441.779178)">0.512723 is heterogeneous historical OOF, not the uniform full-refit model’s performance.</text>
